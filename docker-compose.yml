services:
  postgres:
    image: postgres:16-alpine
    container_name: kb-rag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kbrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kbrag}
      POSTGRES_DB: ${POSTGRES_DB:-kbrag}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-kbrag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kb-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: kb-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: kb-rag-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kbrag}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kbrag123456}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  pgdata:
  qdrant-data:
  redis-data:
  minio-data:
